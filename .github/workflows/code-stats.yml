name: Update Code Stats

on:
  schedule:
    - cron: "0 17 * * *" # tiap hari, 00:00 WIB
  workflow_dispatch: # bisa dijalankan manual dari tab Actions
  push:
    paths:
      - scripts/code_stats.py

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Hitung baris kode
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USER: NoName-LastMan
        run: python scripts/code_stats.py

      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/code-stats.svg assets/code-stats.json
          git diff --staged --quiet || (git commit -m "chore: update code stats" && git push)
